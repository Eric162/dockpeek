name: Swift
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
jobs:
  check:
    name: Quality checks
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        run: make bootstrap
      - name: Validate Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != '0000000000000000000000000000000000000000' ]; then
            python3 scripts/check_commits.py --range "$BASE_SHA..$HEAD_SHA"
          else
            python3 scripts/check_commits.py --range "$HEAD_SHA"
          fi
      - name: Format, lint, debug and release builds, coverage, analysis
        run: make check
      - name: Package and verify signed app
        run: make app
      - name: Upload analysis and coverage reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-reports
          path: .build/reports/
          if-no-files-found: warn
          retention-days: 14
  sanitizers:
    name: Runtime sanitizers
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Address and thread sanitizer tests
        run: make sanitize
